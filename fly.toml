# fly.toml app configuration file generated for movie-talkin on 2026-05-09T14:17:54-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'movie-talkin'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'node apps/api/dist/db/migrate.js'

[env]
  PORT = '3000'
  STATIC_ROOT = 'apps/web/dist'
  # Embedded replica: local SQLite file synced from Turso (DB_URL secret).
  # Reads hit this file (sub-ms); writes commit to Turso and sync back.
  LOCAL_DB_URL = 'file:./replica.db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
