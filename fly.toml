# fly.toml for movie-talkin
# Generated and tracked by version control. Run `fly launch --no-deploy` once
# to claim an app name; replace the placeholder below if Fly suggests a different one.

app = "movie-talkin"
primary_region = "iad"

[build]

[deploy]
release_command = "node apps/api/dist/db/migrate.js"

[env]
PORT = "3000"
STATIC_ROOT = "apps/web/dist"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
